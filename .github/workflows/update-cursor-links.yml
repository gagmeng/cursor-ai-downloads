name: Update Cursor Download Links

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly at minute 0
  workflow_dispatch:     # Allow manual triggering

permissions:
  contents: write

# A manual dispatch can overlap the hourly run; without this both jobs would
# push and one would lose.
concurrency:
  group: update-cursor-links
  cancel-in-progress: false

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Fetch latest links
        id: update-script
        run: bun src/update-cursor-links.ts

      - name: Regenerate README
        run: bun src/update-readme-from-history.ts

      - name: Commit if anything changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add README.md version-history.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Update Cursor download links"
          git pull --rebase --autostash
          git push
